<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>SecureDrop Guard</title>
    <style>
      body { width: 320px; margin: 0; padding: 16px; font: 14px system-ui, "Malgun Gothic", sans-serif; color: #1f2328; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 8px; }
      .check { display: flex; gap: 6px; align-items: center; font-weight: 400; }
      .check input { margin: 0; }
      button { margin-top: 14px; padding: 7px 12px; cursor: pointer; }
      #status { margin-top: 12px; min-height: 20px; }
      .ok { color: #1a7f37; } .bad { color: #b42318; }
      small { color: #57606a; display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>SecureDrop Guard</h1>
    <label for="apiBase">API 주소 (API Gateway, /prod 포함)</label>
    <input id="apiBase" type="text" spellcheck="false" />
    <label for="webBase">웹 주소 (CloudFront)</label>
    <input id="webBase" type="text" spellcheck="false" />
    <label class="check"><input id="failClosed" type="checkbox" />서버 무응답 시 전송 차단 (fail-closed)</label>
    <small>끄면 서버에 연결할 수 없을 때 검사 없이 전송됩니다.</small>
    <button id="save">저장 후 연결 확인</button>
    <div id="status" role="status"></div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
