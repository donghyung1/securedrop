<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureDrop Cloud</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">SecureDrop <span>Cloud</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="upload" role="tab">파일 전송</button>
      <button class="tab" data-view="logs" role="tab">이력</button>
    </nav>
    <span id="api-mode" class="badge" title="URL에 ?api=real 또는 ?api=mock 으로 전환"></span>
  </header>

  <main>
    <!-- ============ 업로드 화면 (STEP 1~5) ============ -->
    <section id="view-upload" class="view">
      <ol class="steps" id="steps">
        <li data-step="1">파일 선택</li>
        <li data-step="2">민감정보 검사</li>
        <li data-step="3">조치 선택</li>
        <li data-step="4">정제·재검사</li>
        <li data-step="5">승인·QR 전송</li>
      </ol>

      <div class="layout">
        <div class="col-main">
          <!-- STEP 1: 파일 선택 -->
          <div class="card">
            <label id="dropzone" class="dropzone" for="file-input">
              <input type="file" id="file-input" hidden>
              <strong>휴대폰으로 보낼 파일을 선택하세요</strong>
              <span class="muted">끌어다 놓거나 클릭 · 최대 20MB · .txt / .csv 는 민감정보를 자동 검사합니다</span>
            </label>
            <div id="file-info" class="file-info" hidden>
              <div>
                <div id="file-name" class="file-name"></div>
                <div id="file-meta" class="muted"></div>
              </div>
              <button id="btn-reset" class="btn btn-ghost" type="button">다른 파일</button>
            </div>
          </div>

          <!-- STEP 2: 검사 결과 -->
          <div id="scan-card" class="card" hidden>
            <h2>민감정보 검사</h2>
            <div id="scan-status" class="status" aria-live="polite"></div>
            <ul id="scan-findings" class="findings"></ul>
          </div>

          <!-- 전송 옵션 -->
          <div id="send-card" class="card" hidden>
            <h2>전송</h2>
            <div class="field">
              <label for="expires">링크 만료 시간</label>
              <select id="expires"></select>
            </div>
            <label id="confirm-row" class="confirm" hidden>
              <input type="checkbox" id="confirm-check">
              <span id="confirm-text"></span>
            </label>
            <div class="actions">
              <button id="btn-send" class="btn btn-primary" type="button" disabled>QR 코드 만들기</button>
            </div>
            <div id="send-error" class="error" role="alert" hidden></div>
          </div>

          <!-- STEP 5: QR 결과 -->
          <div id="qr-card" class="card qr-card" hidden>
            <h2>휴대폰으로 스캔하세요</h2>
            <img id="qr-img" alt="다운로드 QR 코드" width="220" height="220">
            <div class="qr-meta">
              <div>만료까지 <strong id="qr-countdown">--:--</strong></div>
              <div class="muted" id="qr-status"></div>
            </div>
            <div class="actions">
              <button id="btn-copy" class="btn btn-ghost" type="button">링크 복사</button>
              <button id="btn-revoke" class="btn btn-danger" type="button">링크 폐기</button>
              <button id="btn-new" class="btn btn-ghost" type="button">새 파일 보내기</button>
            </div>
          </div>
        </div>

        <!-- SecureGuard 패널 (STEP 3, Day 3에 조치 버튼 연결) -->
        <aside class="col-side">
          <div class="card guard">
            <div class="guard-head">
              <span class="guard-dot"></span> SecureGuard
            </div>
            <div id="guard-messages" class="guard-messages">
              <p class="bubble">파일을 선택하면 민감정보를 검사하고 결과를 설명해 드립니다.</p>
            </div>
            <div id="guard-buttons" class="guard-buttons"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ============ 로그 화면 ============ -->
    <section id="view-logs" class="view" hidden>
      <div class="card">
        <div class="row-between">
          <h2>차단·정제·전송 이력</h2>
          <button id="btn-logs-refresh" class="btn btn-ghost" type="button">새로고침</button>
        </div>
        <p class="muted">유형과 시간만 기록되며 원문과 파일 내용은 저장되지 않습니다.</p>
        <table class="logs">
          <thead><tr><th>시각</th><th>이벤트</th><th>탐지 유형</th><th>출처</th></tr></thead>
          <tbody id="logs-body"></tbody>
        </table>
        <div id="logs-empty" class="muted center" hidden>기록이 없습니다.</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
