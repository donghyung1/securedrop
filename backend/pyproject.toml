[project]
name = "securedrop-backend"
version = "1.3.0"
description = "SecureDrop Cloud backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
    "boto3>=1.43.117",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "mangum>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "moto[s3,dynamodb]>=5.2.4",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "zxing-cpp>=3.1.1",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
