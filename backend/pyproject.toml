[project]
name = "securedrop-backend"
version = "1.3.0"
description = "SecureDrop Cloud backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "boto3>=1.35,<2",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "segno>=1.6,<2",
    "mangum>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "moto[s3,dynamodb]>=5,<6",
    "httpx>=0.28,<1",
    "httpx2>=2.14.0",
    "zxing-cpp>=2.3,<4",
    "pillow>=10,<13",
    "playwright>=1.45,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
